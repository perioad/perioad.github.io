<!--
  The same letter for platforms that crop an icon to a shape of their choosing.
  Full bleed, since the corners are cut by whoever is drawing it. The mark is
  small and centred already, so a circular crop takes none of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <rect width="48" height="48" fill="#000000" />
  <path
    d="M26.25 21.32 A 3.5 3.5 0 1 0 26.25 26.68"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.3"
  />
</svg>
