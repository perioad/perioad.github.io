<!--
  A lowercase c, drawn as an arc rather than set in a typeface: an icon is
  fetched on its own, with no stylesheet and no web font behind it, so a letter
  written as text here would be left to whatever the device happened to have.
  The 48 unit grid is the one the site's favicon was drawn on.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <rect width="48" height="48" rx="10.5" fill="#000000" />
  <!-- Nearly a full circle, opened on the right. Flat ends rather than round
       ones, which is how a monospace face cuts its terminals. -->
  <path
    d="M26.25 21.32 A 3.5 3.5 0 1 0 26.25 26.68"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.3"
  />
</svg>
